
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    name: Java - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ms-auth, ms-cliente, ms-conta, ms-email, ms-gerente, ms-orquestrador]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bantads
          POSTGRES_PASSWORD: bantads
          POSTGRES_DB: bantads
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bantads"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mongo:
        image: mongo:7
        ports: ["27017:27017"]

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/bantads
      SPRING_DATASOURCE_USERNAME: bantads
      SPRING_DATASOURCE_PASSWORD: bantads
      SPRING_MONGODB_URI: mongodb://localhost:27017/bantads

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      - name: Build e testes
        run: sh mvnw -B -ntp verify

      - name: Relatorio dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/*.jar
          retention-days: 1

  gateway:
    name: API Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/api-gateway/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx ng lint
      - name: Testes
        run: npx ng test --watch=false
      - name: Build de producao
        run: npx ng build

  images:
    name: Imagem - ${{ matrix.service }}
    needs: [java, gateway, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: api-gateway,     dockerfile: Dockerfile, java: false }
          - { service: ms-auth,         dockerfile: Dockerfile, java: true }
          - { service: ms-cliente,      dockerfile: Dockerfile, java: true }
          - { service: ms-conta,        dockerfile: DockerFile, java: true }
          - { service: ms-email,        dockerfile: Dockerfile, java: true }
          - { service: ms-gerente,      dockerfile: Dockerfile, java: true }
          - { service: ms-orquestrador, dockerfile: Dockerfile, java: true }

    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4

      - name: Baixar o jar
        if: matrix.java
        uses: actions/download-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: services/${{ matrix.service }}/target

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bantads-${{ matrix.service }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/${{ matrix.dockerfile }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
