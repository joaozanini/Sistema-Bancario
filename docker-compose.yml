services:
  postgres:
    image: postgres:16
    container_name: bantads-postgres
    # Um único contêiner com o banco "bantads"; cada MS cria o próprio schema via Flyway (schema-per-service)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bantads}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?preencha POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-bantads}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bantads-net
    mem_limit: 384m
    command: ["postgres", "-c", "shared_buffers=128MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bantads"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: bantads-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - bantads-net
    mem_limit: 384m
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bantads-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?preencha REDIS_PASSWORD no .env}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bantads-net
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: bantads-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?preencha RABBITMQ_PASSWORD no .env}
    # Com load_definitions o RabbitMQ não cria o usuário padrão, cria aqui a partir do .env
    command:
      - sh
      - -c
      - |
        su-exec rabbitmq sh -c '
          until rabbitmqctl await_startup >/dev/null 2>&1; do sleep 2; done
          rabbitmqctl add_user "$$RABBITMQ_DEFAULT_USER" "$$RABBITMQ_DEFAULT_PASS" 2>/dev/null \
            || rabbitmqctl change_password "$$RABBITMQ_DEFAULT_USER" "$$RABBITMQ_DEFAULT_PASS"
          rabbitmqctl set_user_tags "$$RABBITMQ_DEFAULT_USER" administrator
          rabbitmqctl set_permissions -p / "$$RABBITMQ_DEFAULT_USER" ".*" ".*" ".*"
        ' &
        exec docker-entrypoint.sh rabbitmq-server
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - bantads-net
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmqctl -q authenticate_user \"$$RABBITMQ_DEFAULT_USER\" \"$$RABBITMQ_DEFAULT_PASS\""]
      interval: 15s
      timeout: 10s
      retries: 5

  ms-orquestrador:
    build: ./services/ms-orquestrador
    container_name: bantads-ms-orquestrador
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60 -XX:+UseSerialGC
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bantads-net
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8090/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  ms-email:
    build: ./services/ms-email
    container_name: bantads-ms-email
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60 -XX:+UseSerialGC
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - GMAIL_USERNAME=${GMAIL_USERNAME}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - bantads-net
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8091/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Os MSs não publicam portas: só o API Gateway fala com eles, pela rede interna
  ms-auth:
    build: ./services/ms-auth
    container_name: bantads-ms-auth
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60 -XX:+UseSerialGC
      - MONGO_URI=mongodb://mongo:27017/bantads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - bantads-net
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  ms-cliente:
    build: ./services/ms-cliente
    container_name: bantads-ms-cliente
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60 -XX:+UseSerialGC
      - DB_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-bantads}
      - POSTGRES_USER=${POSTGRES_USER:-bantads}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bantads-net
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  ms-gerente:
    build: ./services/ms-gerente
    container_name: bantads-ms-gerente
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60 -XX:+UseSerialGC
      - DB_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-bantads}
      - POSTGRES_USER=${POSTGRES_USER:-bantads}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bantads-net
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  ms-conta:
    build: ./services/ms-conta
    container_name: bantads-ms-conta
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60 -XX:+UseSerialGC
      - DB_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-bantads}
      - POSTGRES_USER=${POSTGRES_USER:-bantads}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bantads-net
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  api-gateway:
    build: ./services/api-gateway
    container_name: bantads-api-gateway
    environment:
      - NODE_OPTIONS=--max-old-space-size=192
      - PORT=3000
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:4200}
      - JWT_SECRET=${JWT_SECRET:?preencha JWT_SECRET no .env}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-8h}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # O Gateway publica os pedidos de SAGA em saga.cmd
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - MS_AUTH_URL=http://ms-auth:8081
      - MS_CLIENTE_URL=http://ms-cliente:8082
      - MS_GERENTE_URL=http://ms-gerente:8083
      - MS_CONTA_URL=http://ms-conta:8080
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-auth:
        condition: service_healthy
      ms-cliente:
        condition: service_healthy
      ms-gerente:
        condition: service_healthy
      ms-conta:
        condition: service_healthy
    networks:
      - bantads-net
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Build estático do Angular servido pelo nginx; o navegador chama o Gateway em localhost:3000
  frontend:
    build: ./frontend
    container_name: bantads-frontend
    ports:
      - "4200:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - bantads-net
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  bantads-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
