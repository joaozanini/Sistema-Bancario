server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Os arquivos com hash no nome mudam de URL a cada build, entao podem ser
    # cacheados para sempre. Bloco de regex vem antes do prefixo "/" na ordem
    # de resolucao do nginx, entao estes nao caem no no-cache abaixo.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # O roteamento do Angular e no cliente: sem o fallback, recarregar a pagina
    # em /cliente ou /gerente devolveria 404 do nginx.
    # no-cache porque toda rota cai aqui e devolve o index.html, que aponta para
    # os bundles com hash: um index velho em cache carrega a versao anterior do
    # app mesmo depois de um deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
