<main class="login-page">
  <app-logo class="logo" />

  <section class="login-card" aria-labelledby="login-titulo">
    <header class="card-header">
      <h1 id="login-titulo">Acesse sua conta</h1>
      <p>Entre com seu e-mail e senha do BANTADS.</p>
    </header>

    @if (aviso()) {
      <p class="sucesso" role="status">{{ aviso() }}</p>
    }

    <form (ngSubmit)="entrar()" novalidate>
      <label>
        <span>E-mail</span>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="seu@email.com"
          autocomplete="username"
          required
        >
      </label>

      <label>
        <span>Senha</span>
        <input
          type="password"
          name="senha"
          [(ngModel)]="senha"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required
        >
      </label>

      @if (erro()) {
        <p class="erro" role="alert">{{ erro() }}</p>
      }

      <button type="submit" [disabled]="carregando()">
        {{ carregando() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <p class="cadastro-link">Não tem conta? <a routerLink="/register">Cadastre-se</a></p>
  </section>
</main>
