<main class="register-page">
  <a class="brand" routerLink="/login" aria-label="BANTADS - Ir para o login">
    <span>BANTADS</span>
  </a>

  <section class="register-card" aria-labelledby="register-title">
    <header class="card-header">
      <h1 id="register-title">Abra sua conta</h1>
      <p>Preencha os campos abaixo para enviar sua solicitação de cadastro.</p>
    </header>

    <form #registerForm="ngForm" (ngSubmit)="enviarSolicitacao(registerForm)" novalidate>
      <fieldset>
        <legend>Informações pessoais</legend>

        <div class="form-grid">
          <label class="full-width">
            <span>Nome completo</span>
            <input
              type="text"
              name="nome"
              [(ngModel)]="nome"
              #nomeInput="ngModel"
              placeholder="Digite seu nome completo"
              autocomplete="name"
              required
            >
            @if (nomeInput.invalid && nomeInput.touched) {
              <small>Informe seu nome completo.</small>
            }
          </label>

          <label>
            <span>CPF</span>
            <input
              type="text"
              name="cpf"
              [(ngModel)]="cpf"
              #cpfInput="ngModel"
              placeholder="000.000.000-00"
              autocomplete="off"
              inputmode="numeric"
              maxlength="14"
              pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
              required
            >
            @if (cpfInput.invalid && cpfInput.touched) {
              <small>Use o formato 000.000.000-00.</small>
            }
          </label>

          <label>
            <span>Telefone</span>
            <input
              type="tel"
              name="telefone"
              [(ngModel)]="telefone"
              #telefoneInput="ngModel"
              placeholder="(11) 98765-4321"
              autocomplete="tel"
              maxlength="15"
              required
            >
            @if (telefoneInput.invalid && telefoneInput.touched) {
              <small>Informe seu telefone.</small>
            }
          </label>

          <label>
            <span>E-mail</span>
            <input
              type="email"
              name="email"
              [(ngModel)]="email"
              #emailInput="ngModel"
              placeholder="seu@email.com"
              autocomplete="email"
              required
              email
            >
            @if (emailInput.invalid && emailInput.touched) {
              <small>Informe um e-mail válido.</small>
            }
          </label>

          <label>
            <span>Salário (R$)</span>
            <input
              type="number"
              name="salario"
              [(ngModel)]="salario"
              #salarioInput="ngModel"
              placeholder="Ex.: 2500,00"
              inputmode="decimal"
              min="0.01"
              step="0.01"
              required
            >
            @if (salarioInput.invalid && salarioInput.touched) {
              <small>Informe um valor maior que zero.</small>
            }
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Endereço residencial</legend>

        <div class="form-grid">
          <label>
            <span>Logradouro</span>
            <input
              type="text"
              name="logradouro"
              [(ngModel)]="logradouro"
              #logradouroInput="ngModel"
              placeholder="Rua, avenida, etc."
              autocomplete="street-address"
              required
            >
            @if (logradouroInput.invalid && logradouroInput.touched) {
              <small>Informe o logradouro.</small>
            }
          </label>

          <label>
            <span>Número</span>
            <input
              type="text"
              name="numero"
              [(ngModel)]="numero"
              #numeroInput="ngModel"
              placeholder="123"
              autocomplete="address-line2"
              required
            >
            @if (numeroInput.invalid && numeroInput.touched) {
              <small>Informe o número.</small>
            }
          </label>

          <label>
            <span>Complemento</span>
            <input
              type="text"
              name="complemento"
              [(ngModel)]="complemento"
              placeholder="Apto, bloco, etc."
              autocomplete="address-line3"
            >
          </label>

          <label>
            <span>CEP</span>
            <input
              type="text"
              name="cep"
              [(ngModel)]="cep"
              #cepInput="ngModel"
              placeholder="00000-000"
              autocomplete="postal-code"
              inputmode="numeric"
              maxlength="9"
              pattern="[0-9]{5}-[0-9]{3}"
              required
            >
            @if (cepInput.invalid && cepInput.touched) {
              <small>Use o formato 00000-000.</small>
            }
          </label>

          <label>
            <span>Cidade</span>
            <input
              type="text"
              name="cidade"
              [(ngModel)]="cidade"
              #cidadeInput="ngModel"
              placeholder="Digite sua cidade"
              autocomplete="address-level2"
              required
            >
            @if (cidadeInput.invalid && cidadeInput.touched) {
              <small>Informe a cidade.</small>
            }
          </label>

          <label>
            <span>Estado</span>
            <select
              name="estado"
              [(ngModel)]="estado"
              #estadoInput="ngModel"
              autocomplete="address-level1"
              required
            >
              <option value="" disabled>Selecione o estado</option>
              @for (uf of estados; track uf) {
                <option [value]="uf">{{ uf }}</option>
              }
            </select>
            @if (estadoInput.invalid && estadoInput.touched) {
              <small>Selecione o estado.</small>
            }
          </label>
        </div>
      </fieldset>

      <button type="submit">Enviar solicitação</button>

      @if (solicitacaoEnviada) {
        <p class="success-message" role="status">
          Solicitação preenchida com sucesso.
        </p>
      }
    </form>

    <p class="login-link">Já tem conta? <a routerLink="/login">Faça login</a></p>
  </section>
</main>
