<header class="header">
  @if (usuario) {
    <div class="usuario">
      <span class="avatar" aria-hidden="true">{{ iniciais }}</span>
      <div class="dados">
        <strong>
          {{ usuario.nome }}
          @if (ehGerente) {
            <span class="tipo">(Gerente)</span>
          }
        </strong>
        @if (numeroConta(); as numero) {
          <span>Conta {{ numero }}</span>
        } @else {
          <span>{{ usuario.email }}</span>
        }
      </div>
    </div>
  } @else {
    <span>Internet Banking</span>
  }
</header>
